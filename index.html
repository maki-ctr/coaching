<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coaching License Lab — Route to the A License</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#F2F4F1; --panel:#FFFFFF; --ink:#17202A; --ink-2:#4B5663; --ink-3:#77828E;
  --rule:#D5DBDF; --rule-2:#E8ECEE;
  --frame:#1D2A36; --frame-ink:#DCE3EA; --frame-ink-2:#8E9FAF; --frame-hover:rgba(255,255,255,.07);
  --blue:#2353C4; --blue-ink:#FFFFFF; --blue-soft:#E4EBFA;
  --red:#CC3A2C; --red-soft:#FBE6E3;
  --amber:#E09E14; --amber-soft:#FBF0D5;
  --ok:#2C7A4B; --ok-soft:#E0F0E6;
  --pitch:#2E7A4D; --pitch-2:#2A7147; --pline:rgba(255,255,255,.82);
  --shadow:0 1px 2px rgba(23,32,42,.05),0 6px 18px rgba(23,32,42,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#10161D; --panel:#18212B; --ink:#E6EBEF; --ink-2:#AAB5BF; --ink-3:#7F8B96;
  --rule:#2B3743; --rule-2:#222C37;
  --frame:#0B1016; --frame-ink:#D9E1E8; --frame-ink-2:#7D8D9C; --frame-hover:rgba(255,255,255,.06);
  --blue:#7398F2; --blue-ink:#0B1220; --blue-soft:#1C2A47;
  --red:#F0705F; --red-soft:#3A1F1C; --amber:#F0B84A; --amber-soft:#3A2F17;
  --ok:#5DBB86; --ok-soft:#17311F; --pitch:#22603C; --pitch-2:#1F5836; --pline:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --board:#10161D; --panel:#18212B; --ink:#E6EBEF; --ink-2:#AAB5BF; --ink-3:#7F8B96;
  --rule:#2B3743; --rule-2:#222C37;
  --frame:#0B1016; --frame-ink:#D9E1E8; --frame-ink-2:#7D8D9C; --frame-hover:rgba(255,255,255,.06);
  --blue:#7398F2; --blue-ink:#0B1220; --blue-soft:#1C2A47;
  --red:#F0705F; --red-soft:#3A1F1C; --amber:#F0B84A; --amber-soft:#3A2F17;
  --ok:#5DBB86; --ok-soft:#17311F; --pitch:#22603C; --pitch-2:#1F5836; --pline:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.cond{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--frame);color:var(--frame-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 0 24px;display:flex;flex-direction:column}
.brand{padding:0 24px 20px}
.brand .mark{display:flex;align-items:center;gap:10px}
.brand .mag{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#fff;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand .name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;line-height:1;letter-spacing:.2px}
.brand .who{font-size:13px;color:var(--frame-ink-2);margin-top:10px;line-height:1.4}
.navgrp{font-size:12.5px;color:var(--frame-ink-2);padding:16px 26px 6px;font-weight:600}
.nav{list-style:none;padding:0 12px}
.nav button{width:100%;text-align:left;background:none;border:0;color:var(--frame-ink);font-size:15px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav button:hover{background:var(--frame-hover)}
.nav button .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--frame-ink-2);flex-shrink:0}
.nav button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.nav button.on .dot{background:var(--amber);border-color:var(--amber)}
.side-foot{margin-top:auto;padding:18px 26px 0;font-size:12.5px;color:var(--frame-ink-2);line-height:1.45}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--frame-ink);border-radius:7px;padding:6px 12px;cursor:pointer;margin-bottom:12px;font-size:13.5px}
.main{flex:1;min-width:0}
.topbar{display:none;position:sticky;top:0;z-index:30;background:var(--frame);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));align-items:center;justify-content:space-between}
.topbar .name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px}
.burger{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer}
.content{max-width:1000px;margin:0 auto;padding:40px 44px 90px}
#content:focus{outline:none}
.scrim{display:none}

/* type */
h1.page{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:46px;line-height:1;letter-spacing:-.3px;margin-bottom:12px}
.lede{font-size:17.5px;color:var(--ink-2);max-width:66ch;margin-bottom:28px}
h2.sec{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;line-height:1.1;margin:38px 0 12px}
h3{font-size:17px;font-weight:600;line-height:1.3;margin-bottom:6px}
p{max-width:72ch}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tiny{font-size:12.5px;color:var(--ink-3)}
a{color:var(--blue)}

/* surfaces */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.grid2>*,.grid3>*,.grid4>*,.split>*,.row>*{margin-top:0!important}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.flat{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.printonly{display:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.note{border-left:3px solid var(--amber);background:var(--amber-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink)}
.note.blue{border-color:var(--blue);background:var(--blue-soft)}
.note.red{border-color:var(--red);background:var(--red-soft)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--blue);background:var(--blue);color:var(--blue-ink);font-weight:600;font-size:15px;padding:9px 16px;border-radius:999px;cursor:pointer;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.sm{font-size:13.5px;padding:6px 12px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--board);border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--rule-2);color:var(--ink-2)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.amber{background:var(--amber-soft);color:#8a5d00}
:root[data-theme="dark"] .tag.amber{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.amber{color:var(--amber)}}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.in,select.in,textarea.in{width:100%;background:var(--board);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-size:15px;line-height:1.4}
textarea.in{resize:vertical;min-height:70px}
.in:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.field{margin-bottom:12px}
.check{display:flex;gap:11px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:15px;line-height:1.4}
.check input{appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);flex-shrink:0;margin-top:1px;cursor:pointer;display:grid;place-items:center;background:var(--panel)}
.check input:checked{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.check input:checked::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.check.done span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule)}

/* bars */
.bar{height:8px;background:var(--rule-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.bar.amber>i{background:var(--amber)}
.bar.red>i{background:var(--red)}

/* pitch */
.pitchwrap{background:var(--pitch);border-radius:14px;padding:10px;box-shadow:var(--shadow);position:relative}
.pitchwrap svg{display:block;width:100%;height:auto}
.mag-c{cursor:pointer}
.mag-c:focus{outline:none}
.mag-c:focus-visible circle.body{stroke:var(--amber);stroke-width:1.2}
@keyframes pulse{0%{r:3.6;opacity:.9}100%{r:7;opacity:0}}
.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.5}}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t th{font-weight:600;color:var(--ink-2);font-size:13.5px}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15.5px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.card-flip{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;padding:30px}
.card-flip .term{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;line-height:1.05}
.card-flip .def{font-size:17px;max-width:52ch}

/* logger */
.logbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.logbtn{border:1.5px solid var(--rule);background:var(--panel);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;font-weight:600;font-size:15px;line-height:1.2;touch-action:manipulation}
.logbtn b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;line-height:1;margin-bottom:4px}
.logbtn:active{transform:scale(.98);border-color:var(--blue)}
.clock{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.score{display:flex;gap:6px}
.score button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rule);background:var(--panel);cursor:pointer;font-weight:700}
.score button.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

/* list items */
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-2)}
.item:last-child{border-bottom:0}
.sel-list button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:10px 12px;cursor:pointer}
.sel-list button:hover{background:var(--rule-2)}
.sel-list button.on{border-color:var(--blue);background:var(--blue-soft)}
.phase{border:1px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--board)}
.week{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--panel)}
.week.now{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-soft)}
.week h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin-bottom:2px}
.weeks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mom-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.principle{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.principle .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--blue);line-height:1.6}
.xbtn{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:20px;line-height:1;padding:6px}
.xbtn:hover{color:var(--red)}
/* learn */
.video{position:relative;aspect-ratio:16/9;background:var(--frame);border-radius:10px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--frame-ink);text-align:center;padding:20px}
.video-empty b{font-family:'Barlow Condensed',sans-serif;font-size:26px}
.points{padding-left:20px}.points li{margin:6px 0;max-width:72ch}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.thumb{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px;cursor:pointer;text-align:left;font-weight:600;font-size:14.5px}
.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--rule-2);margin-bottom:6px}
.thumb:hover{border-color:var(--blue)}
.figthumb{display:flex;gap:12px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px;cursor:pointer;text-align:left;margin-bottom:20px}
.figthumb img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--rule-2);flex-shrink:0}
.figthumb span{display:flex;flex-direction:column;font-size:15px}
.figthumb:hover{border-color:var(--blue)}
.lb{position:fixed;inset:0;background:rgba(8,12,16,.97);z-index:100;display:none;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 64px calc(24px + env(safe-area-inset-bottom,0px))}
.lb.open{display:flex}
.lb figure{max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center}
.lb img{max-width:100%;max-height:calc(100vh - 130px);border-radius:6px;background:#fff}
.lb figcaption{color:#dfe5ea;margin-top:10px;font-size:15px;text-align:center}
.lb figcaption a{color:#9fb8f5;margin-left:10px}
.lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:28px;line-height:1;cursor:pointer}
.lb-prev{left:10px}.lb-next{right:10px}
@media (max-width:900px){.lb{padding-left:8px;padding-right:8px}.lb-nav{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--board);padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:600;opacity:0;transition:all .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;padding-top:calc(26px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .topbar{display:flex}
  .content{padding:26px 18px 80px}
  h1.page{font-size:36px}
  .grid2,.grid3,.weeks,.split{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
}
@media print{
  .side,.topbar,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .content{padding:0;max-width:none}
  .panel{box-shadow:none;border-color:#bbb}
  .printonly{display:block}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark"><div class="mag" id="brandInit">FA</div><div class="name">Coaching<br>License Lab</div></div>
      <div class="who" id="brandWho"></div>
    </div>
    <div id="navWrap"></div>
    <div class="side-foot">
      <button onclick="go('settings')">Settings</button>
      <div>Aligned to the U.S. Soccer pathway. Confirm requirements in the Learning Center before each step.</div>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="closeNav()"></div>
  <div class="main">
    <div class="topbar"><button class="burger" onclick="openNav()" aria-label="Open menu">Menu</button><div class="name">Coaching License Lab</div><div style="width:58px"></div></div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   CONFIG — edit these for the coach. Everything else adapts.
   ============================================================ */
const CONFIG = {
  coachName: "Freddy Adu",
  background: "Former U.S. Men's National Team international and professional player",
  aTrack: "Senior",            // "Senior" or "Youth"
  courseStart: "2027-01-11",   // first Monday of the B course (YYYY-MM-DD)
  team: "Harbor FC U17",       // the scenario team used in diagrams and videos
  storageKey: "coachlab-v1",
  // YouTube video IDs (unlisted, not private, so they play inside the page). Leave "" until a video is approved.
  videos: {1:"", 2:"", 3:"", 4:"", 5:"", 6:"", 7:"", 8:""}
};

/* ---------- Competency domains ---------- */
const DOMAINS = {
  lead:     {name:"Leadership",          blurb:"Environment, communication, staff and player relationships, self-reflection."},
  train:    {name:"Coaching training",   blurb:"Session design linked to the game model, interventions, adapting in the moment."},
  game:     {name:"Coaching games",      blurb:"Game model, game plans, in-game coaching, half-time, post-match review."},
  player:   {name:"Player development",  blurb:"Individual plans, growth and maturation, long-term development."},
  analysis: {name:"Performance analysis",blurb:"KPIs linked to the game model, coding, video, using evidence to change training."}
};
const QDOMAINS = Object.assign({}, DOMAINS, {safe:{name:"Laws & safeguarding",blurb:"Laws of the Game, SafeSport, concussion and heading guidance."}});

/* ---------- Route milestones (pitch hero) ---------- */
const MILESTONES = [
  {id:"waiver", label:"Waiver",    title:"Waiver into the B course", x:10, y:34,
   hint:"Use playing-career proof to request a waiver of the C License prerequisite.",
   checks:["Learning Center profile created","Playing record compiled: clubs, seasons, senior international caps","Supporting letters or federation confirmation gathered","Waiver request submitted, following the Waiver Process FAQs","Host confirms a place on a B course"]},
  {id:"ready",  label:"Ready",     title:"Compliance and team access", x:22, y:15,
   hint:"Paperwork and a team to coach for the full course.",
   checks:["SafeSport training current","Background screening completed per host and club rules","U13+ team playing 11v11 secured for all 24 weeks","Filming kit: phone or camera, tripod, lapel mic","Club agrees to filmed sessions and matches, with consents in place"]},
  {id:"b1",     label:"B wk 1–12", title:"B course, first half", x:34, y:48,
   hint:"Game model, training design and the first filmed sessions.",
   checks:["Game model v1 written and shared with staff","Four session plans linked to game-model principles","Two sessions filmed and self-reviewed","First in-person meeting attended"]},
  {id:"b2",     label:"B wk 13–24",title:"B course, second half", x:46, y:18,
   hint:"Game coaching, player plans, analysis and the final assessments.",
   checks:["Four game plans with post-match reviews","Three player development plans with a review cycle","Two matches coded against KPIs","Mock assessment interviews rehearsed","Second in-person meeting and final assessments"]},
  {id:"blic",   label:"B License", title:"B License awarded", x:58, y:46,
   hint:"Check the license appears in the Learning Center profile.",

<script>
/* ============================== STATE ============================== */
const clone = o => JSON.parse(JSON.stringify(o));
const LS = CONFIG.storageKey;
let S;
function fresh(){
  const today = new Date().toISOString().slice(0,10);
  const s = {
    cfg:{name:CONFIG.coachName,bg:CONFIG.background,track:CONFIG.aTrack,start:CONFIG.courseStart,theme:"auto"},
    ms:{}, checks:{}, plan:{}, model:clone(SEED.model),
    sessions:clone(SEED.sessions), gameplans:clone(SEED.gameplans), players:clone(SEED.players),
    reviews:clone(SEED.reviews), evidence:clone(SEED.evidence), quiz:{}, cards:{}, reps:[]
  };
  s.reviews.forEach(r=>r.date=r.date||today); s.evidence.forEach(e=>e.date=e.date||today);
  return s;
}
function load(){
  try{ const p = JSON.parse(localStorage.getItem(LS)||"null"); S = p ? Object.assign(fresh(), p) : fresh(); }
  catch(e){ S = fresh(); }
}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }, 200); }

const UI = {view:"dash", mod:1, ses:null, gp:null, pl:null, mom:"poss", pitchOpen:false,
  quiz:null, qdom:"mix", cdom:"all", cidx:0, cflip:false, idom:"all", iq:null, iscore:{},
  log:{secs:0,running:false,counts:{},hist:[],rubric:{},session:"",notes:""}};

/* ============================== UTIL ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const fmt = secs => { secs=Math.max(0,Math.round(secs)); return Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0"); };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pct = x => Math.round(x*100)+"%";
const firstName = () => (S.cfg.name||"Coach").split(" ")[0];
const initials = () => (S.cfg.name||"C").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }
function niceDate(d){ if(!d) return ""; const x=new Date(d+"T12:00:00"); return isNaN(x)?d:x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function applyTheme(){ const t=S.cfg.theme; if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t); }

function weekNow(){
  const st = new Date(S.cfg.start+"T00:00:00"); if(isNaN(st)) return null;
  const diff = (Date.now()-st.getTime())/86400000;
  return diff < 0 ? {pre:true, days:Math.ceil(-diff)} : {pre:false, n:Math.floor(diff/7)+1};
}
function msCurrent(){ return MILESTONES.find(m=>!S.ms[m.id]) || null; }

function readiness(){
  const out = {};
  for(const k in DOMAINS){
    const ev = S.evidence.filter(e=>e.d===k).length;
    const q = S.quiz[k] || {c:0,n:0};
    const kn = q.n ? q.c/q.n : 0;
    const reps = S.reps.filter(r=>r.d===k).length;
    const score = Math.round(Math.min(ev/4,1)*50 + kn*30 + Math.min(reps/3,1)*20);
    out[k] = {score, ev, kn, qn:q.n, reps};
  }
  return out;
}
function nextAction(k, r){
  if(r.ev < 4){
    const where = {lead:"evidence",train:"session",game:"gameday",player:"players",analysis:"evidence"}[k];
    return {text:`Add evidence: ${r.ev} of 4 pieces so far.`, btn:"Build evidence", go:where};
  }
  if(r.qn < 10 || r.kn < .8) return {text:`Knowledge: ${r.qn?pct(r.kn)+" correct":"not tested yet"}. Aim for 80%.`, btn:"Drill this", go:"drill", dom:k};
  return {text:`Interview reps: ${r.reps} of 3 rehearsed.`, btn:"Rehearse", go:"interview", dom:k};
}
function addEvidence(t,d,type){
  S.evidence.push({id:uid(),t,d,type,link:"",date:new Date().toISOString().slice(0,10)}); save(); toast("Added to portfolio");
}

/* ============================== PITCH ============================== */
function pitch(inner,label){
  let stripes=""; for(let i=0;i<7;i++) stripes+=`<rect x="${i*15}" y="0" width="7.5" height="68" fill="rgba(255,255,255,.04)"/>`;
  return `<svg viewBox="-3 -3 111 74" role="img" aria-label="${esc(label||"Pitch")}">
  ${stripes}
  <g fill="none" stroke="var(--pline)" stroke-width=".35">
    <rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/>
    <rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/>
    <rect x="0" y="24.84" width="5.5" height="18.32"/><rect x="99.5" y="24.84" width="5.5" height="18.32"/>
    <path d="M16.5 26.69 A9.15 9.15 0 0 1 16.5 41.31"/><path d="M88.5 26.69 A9.15 9.15 0 0 0 88.5 41.31"/>
    <rect x="-1.8" y="30.34" width="1.8" height="7.32"/><rect x="105" y="30.34" width="1.8" height="7.32"/>
  </g>
  <circle cx="52.5" cy="34" r=".5" fill="var(--pline)"/><circle cx="11" cy="34" r=".45" fill="var(--pline)"/><circle cx="94" cy="34" r=".45" fill="var(--pline)"/>
  ${inner}</svg>`;
}
function routePitch(){
  const cur = msCurrent();
  const pts = MILESTONES.map(m=>`${m.x},${m.y}`).join(" ");
  const ci = cur ? MILESTONES.indexOf(cur) : MILESTONES.length-1;
  const donePts = MILESTONES.slice(0, ci+1).map(m=>`${m.x},${m.y}`).join(" ");
  let g = `<polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".5" stroke-dasharray="1.2 1.4"/>`;
  if(ci>0) g += `<polyline points="${donePts}" fill="none" stroke="#fff" stroke-width=".7"/>`;
  MILESTONES.forEach((m,i)=>{
    const done = !!S.ms[m.id], isCur = cur && cur.id===m.id;
    const fill = done ? "#2353C4" : isCur ? "#E09E14" : "#F5F6F3";
    const txt = done||isCur ? "#fff" : "#1D2A36";
    const last = i===MILESTONES.length-1;
    const ly = (m.y < 30 || last) ? m.y-5.6 : m.y+8;
    g += `<g class="mag-c" tabindex="0" role="button" aria-label="${esc(m.title)}${done?", done":isCur?", current step":""}" onclick="go('route','m-${m.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('route','m-${m.id}')}">
      ${isCur?`<circle cx="${m.x}" cy="${m.y}" r="4.2" fill="none" stroke="#E09E14" stroke-width=".6" class="pulse"/>`:""}
      <circle class="body" cx="${m.x}" cy="${m.y+.4}" r="4" fill="rgba(0,0,0,.25)"/>
      <circle class="body" cx="${m.x}" cy="${m.y}" r="4" fill="${fill}" stroke="rgba(0,0,0,.18)" stroke-width=".3"/>
      <text x="${m.x}" y="${m.y+1.3}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="3.8" fill="${txt}">${done?"✓":i+1}</text>
      <text x="${last?m.x+3:m.x}" y="${ly}" text-anchor="${last?"end":"middle"}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="3.6" fill="#fff" stroke="var(--pitch)" stroke-width=".9" paint-order="stroke">${esc(m.label)}</text>
    </g>`;
  });
  return pitch(g, "Route to the A License, drawn as a move across the pitch");
}
function formationPitch(f){
  const pos = FORMATIONS[f] || FORMATIONS["4-3-3"];
  const g = pos.map(([x,y,l])=>`<g><circle cx="${x}" cy="${y+.35}" r="3.7" fill="rgba(0,0,0,.25)"/><circle cx="${x}" cy="${y}" r="3.7" fill="${l==="GK"?"#E09E14":"#2353C4"}" stroke="rgba(0,0,0,.18)" stroke-width=".3"/><text x="${x}" y="${y+1.1}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="${l.length>2?2.5:3.2}" fill="#fff">${l}</text></g>`).join("");
  return pitch(g, f+" formation");
}

  const ranked = Object.entries(R).sort((a,b)=>a[1].score-b[1].score);
  const [gk, gr] = ranked[0]; const na = nextAction(gk, gr);
  const barCls = s => s<40?"red":s<70?"amber":"ok";

  let week = "";
  if(wk && wk.pre){
    const m = cur || MILESTONES[0];

function pitchScript(){
  const M = S.model;
  const parts = [`My team’s identity: ${M.identity}`, `We start from a ${M.formation}.`];
  for(const [k,m] of Object.entries(MOMENTS)){
    const ps = (M.moments[k]||[]).filter(p=>p.t);
    if(ps.length) parts.push(`${m.name}: ${ps.map(p=>p.t.replace(/\.$/,"")+".").join(" ")}`);
  }
  parts.push(`Everything we train links back to these principles, and our KPIs measure whether we see them on match day.`);
  const words = parts.join(" ").split(/\s+/).length, secs = Math.round(words/140*60);
  return `<div class="panel" style="margin-top:16px">
    <div class="row between"><h3 style="margin:0">The two-minute pitch</h3><span class="tag ${secs<=120?"ok":"amber"}">about ${fmt(secs)} spoken</span></div>
    <div style="margin-top:10px">${parts.map(p=>`<p style="margin-bottom:8px">${esc(p)}</p>`).join("")}</div>
    <p class="small muted" style="margin-top:8px">Say it out loud, then add one example from a real match for the principle you name as most important.</p>
    <button class="btn sm" style="margin-top:10px" onclick="UI.idom='game';UI.iq=PROMPTS.findIndex(p=>p.q.startsWith('Explain your game model'));go('interview')">Rehearse it as an interview answer</button>
  </div>`;
}

let htTimer=null, htLeft=180;
function htStage(){ const e=180-htLeft; return e<60?["Settle","Water and breathing. Let the emotion drop. Staff talk, players listen to each other."]:e<150?["Two or three points","Specific, linked to the game plan, with the units they affect."]:["One message","The single thing every player takes back out."]; }
function htStart(){ if(htTimer){clearInterval(htTimer);htTimer=null;render();return;} if(htLeft<=0) htLeft=180; htTimer=setInterval(()=>{htLeft--; const c=$("#htc"),st=$("#hts"); if(c){c.textContent=fmt(htLeft); const s=htStage(); st.innerHTML=`<b>${s[0]}.</b> ${s[1]}`;} if(htLeft<=0){clearInterval(htTimer);htTimer=null;toast("Time: back out");render();}},1000); render(); }

  let g = S.gameplans.find(x=>x.id===UI.gp) || S.gameplans[0]; UI.gp=g.id; const idx=S.gameplans.indexOf(g);
  const T = (path,lab,rows=2) => { const v=path.split(".").reduce((o,k)=>o[k],g); return `<div class="field"><label class="f">${lab}</label><textarea class="in" rows="${rows}" oninput="S.gameplans[${idx}].${path}=this.value;save()">${esc(v)}</textarea></div>`; };
  const st = htStage();
  return `
  <h1 class="page">Game day</h1>
  <p class="lede">The game plan adapts the game model to one opponent. Keep the messages few, rehearse the half-time talk, and close the loop with a review that feeds next week’s training.</p>

      <div class="sel-list">${S.gameplans.map(x=>`<button class="${x.id===g.id?"on":""}" onclick="UI.gp='${x.id}';render()"><div style="font-weight:600;font-size:14.5px">${esc(x.opponent||"Opponent to confirm")}</div><div class="tiny">${esc(niceDate(x.date)||x.comp||"")}</div></button>`).join("")}</div>
    </div>

      <div class="panel">
        <div class="grid3">
          <div class="field"><label class="f">Opponent</label><input class="in" value="${esc(g.opponent)}" oninput="S.gameplans[${idx}].opponent=this.value;save()"></div>

let logTimer=null;
function logStats(c,secs){
  const n=k=>c[k]||0, total=LOGTYPES.reduce((a,t)=>a+n(t.k),0);
  const verbal=n("q")+n("cmd")+n("spec")+n("gen")+n("flow"), mins=Math.max(secs/60,.0001);
  const s={total, perMin: secs?total/mins:0, qPct: verbal?n("q")/verbal:0, stop10: secs?n("stop")/(secs/600):0, spec:n("spec"), gen:n("gen")};
  const flags=[];
  if(secs>=120 && s.stop10>2.5) flags.push("Lots of stoppages for the time. Could some be in-flow cues instead?");
  if(n("gen")>n("spec")) flags.push("More general praise than specific feedback. Name the cue or the decision.");
  if(verbal>=5 && s.qPct<.2) flags.push("Few questions. Try one guided-discovery question at each stoppage.");
  if(n("cmd")>Math.max(n("q"),1)*2) flags.push("Instruction-heavy. Mix in questions so players own the solution.");
  if(!flags.length && total>=5) flags.push("Balanced profile. Now check whether the interventions stayed on the topic.");
  s.flags=flags; return s;
}
function statsHTML(c,secs){
  const s=logStats(c,secs);
  return `<div class="grid3" style="margin-top:12px">
    <div class="flat"><div class="tiny">Interventions per minute</div><div class="cond" style="font-size:28px;font-weight:800">${s.perMin.toFixed(1)}</div></div>
    <div class="flat"><div class="tiny">Questions, share of talk</div><div class="cond" style="font-size:28px;font-weight:800">${pct(s.qPct)}</div></div>
    <div class="flat"><div class="tiny">Specific vs general feedback</div><div class="cond" style="font-size:28px;font-weight:800">${s.spec} : ${s.gen}</div></div>
  </div>
  ${s.flags.length?`<div class="note" style="margin-top:12px">${s.flags.map(f=>`<div>${esc(f)}</div>`).join("")}<div class="tiny" style="margin-top:6px">Prompts for reflection, not rules.</div></div>`:""}`;
}
function tickLog(){
  const L=UI.log; const c=$("#logc"); if(c) c.textContent=fmt(L.secs);
  const st=$("#logstats"); if(st) st.innerHTML=statsHTML(L.counts,L.secs);
}
function logToggle(){ const L=UI.log; if(L.running){clearInterval(logTimer);L.running=false;} else {L.running=true; logTimer=setInterval(()=>{L.secs++; tickLog();},1000);} render(); }
function logHit(k){ const L=UI.log; L.counts[k]=(L.counts[k]||0)+1; L.hist.push(k); const b=$("#lb-"+k); if(b) b.textContent=L.counts[k]; tickLog(); }
function logUndo(){ const L=UI.log; const k=L.hist.pop(); if(!k) return; L.counts[k]--; const b=$("#lb-"+k); if(b) b.textContent=L.counts[k]; tickLog(); }
function logSave(){

  UI.log={secs:0,running:false,counts:{},hist:[],rubric:{},session:"",notes:""}; save(); toast("Review saved"); render();
}

function ivReset(){ clearInterval(ivTimer); ivTimer=null; ivLeft=120; }
function ivStart(){ if(ivTimer){clearInterval(ivTimer);ivTimer=null;render();return;} if(ivLeft<=0) ivLeft=120; ivTimer=setInterval(()=>{ivLeft--; const c=$("#ivc"); if(c) c.textContent=fmt(ivLeft); if(ivLeft<=0){clearInterval(ivTimer);ivTimer=null;toast("Two minutes: wrap up");render();}},1000); render(); }

/* ============================== KNOWLEDGE DRILLS ============================== */
function qStart(){
  const pool = QUESTIONS.map((q,i)=>({...q,i})).filter(q=>UI.qdom==="mix"||q.d===UI.qdom);
  const items = shuffle(pool).slice(0,10).map(q=>{
    if(q.fx) return q;                       // order-dependent options (numeric/day sequences) stay fixed
    const order = shuffle(q.o.map((_,j)=>j));
    return {...q, o:order.map(j=>q.o[j]), a:order.indexOf(q.a)};
  });
  UI.quiz = {items, pos:0, picked:null, right:0, misses:[]};
  render();
}
function qPick(o){
  const Q=UI.quiz, it=Q.items[Q.pos]; if(Q.picked!==null) return;
  Q.picked=o; const ok=o===it.a; if(ok) Q.right++; else Q.misses.push(it);
  const st=S.quiz[it.d]||(S.quiz[it.d]={c:0,n:0}); st.n++; if(ok) st.c++; save(); render();
}
VIEWS.drill = () => {
  const Q=UI.quiz;
  const chips = `<div class="row" style="margin-bottom:16px"><button class="chip ${UI.qdom==="mix"?"on":""}" onclick="UI.qdom='mix';UI.quiz=null;render()">Mixed</button>${Object.entries(QDOMAINS).map(([k,d])=>{const s=S.quiz[k];return `<button class="chip ${UI.qdom===k?"on":""}" onclick="UI.qdom='${k}';UI.quiz=null;render()">${d.name}${s&&s.n?` <span style="opacity:.6;margin-left:6px">${pct(s.c/s.n)}</span>`:""}</button>`;}).join("")}</div>`;
  const head = `<h1 class="page">Knowledge drills</h1><p class="lede">The thinking behind the practical work: coaching science, game concepts, analysis, the Laws and safeguarding. Ten questions a round, with the reasoning after each answer.</p>`;
  if(!Q) return head+chips+`<div class="panel"><p style="margin-bottom:14px">${QUESTIONS.filter(q=>UI.qdom==="mix"||q.d===UI.qdom).length} questions in this set.</p><button class="btn" onclick="qStart()">Start a round</button></div>`;
  if(Q.pos>=Q.items.length){
    return head+chips+`<div class="panel"><h3>Round complete: ${Q.right} of ${Q.items.length}</h3><p class="muted" style="margin-bottom:12px">${Q.right/Q.items.length>=.8?"Strong round.":"Read the explanations below, then run the set again."}</p>
      ${Q.misses.map(m=>`<div class="item" style="display:block"><div style="font-weight:600">${esc(m.q)}</div><div class="small" style="margin-top:4px"><b>${esc(m.o[m.a])}.</b> ${esc(m.e)}</div></div>`).join("")}
      <button class="btn" style="margin-top:12px" onclick="qStart()">Another round</button></div>`;
  }
  const it=Q.items[Q.pos], answered=Q.picked!==null;
  return head+chips+`<div class="panel">
    <div class="row between small muted" style="margin-bottom:8px"><span>Question ${Q.pos+1} of ${Q.items.length}</span><span>${QDOMAINS[it.d].name}</span></div>
    <div class="bar" style="margin-bottom:16px"><i style="width:${Q.pos/Q.items.length*100}%"></i></div>
    <h3 style="font-size:19px">${esc(it.q)}</h3>
    ${it.o.map((o,j)=>`<button class="opt ${answered&&j===it.a?"right":""} ${answered&&j===Q.picked&&j!==it.a?"wrong":""}" ${answered?"disabled":""} onclick="qPick(${j})">${esc(o)}</button>`).join("")}
    ${answered?`<div class="note ${Q.picked===it.a?"blue":"red"}" style="margin-top:12px"><b>${Q.picked===it.a?"Correct.":"Not quite."}</b> ${esc(it.e)}</div><button class="btn" style="margin-top:12px" onclick="UI.quiz.pos++;UI.quiz.picked=null;render()">${Q.pos+1<Q.items.length?"Next question":"See results"}</button>`:""}
  </div>`;
};

  </div>`;
};

      <div class="field"><label class="f" for="evd">Competency</label><select class="in" id="evd">${Object.entries(DOMAINS).map(([k,d])=>`<option value="${k}">${d.name}</option>`).join("")}</select></div>
      <div class="field"><label class="f" for="evy">Type</label><select class="in" id="evy">${["Session plan","Video","Video review","Game plan","Player plan","Analysis report","Reflection","Document","Feedback from educator"].map(t=>`<option>${t}</option>`).join("")}</select></div>
    </div>
    <button class="btn" onclick="const t=$('#evt').value.trim();if(!t){toast('Add a title first');return;}S.evidence.push({id:uid(),t,d:$('#evd').value,type:$('#evy').value,link:$('#evl').value.trim(),date:new Date().toISOString().slice(0,10)});save();toast('Added to portfolio');render()">Add to portfolio</button>
  </div>
  ${Object.entries(DOMAINS).map(([k,d])=>`<h2 class="sec">${d.name}</h2><div class="panel">${by[k].length?by[k].map(e=>`<div class="item"><div><div style="font-weight:600">${e.link&&/^https?:\/\//.test(e.link)?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.t)}</a>`:esc(e.t)}</div><div class="small muted">${esc(e.type)}${e.date?", "+esc(niceDate(e.date)):""}</div></div><button class="xbtn" aria-label="Remove item" onclick="if(confirm('Remove this item?')){S.evidence=S.evidence.filter(x=>x.id!=='${e.id}');save();render()}">×</button></div>`).join(""):`<p class="muted small">Nothing yet. ${d.blurb}</p>`}</div>`).join("")}`;
};

/* ============================== SETTINGS ============================== */
VIEWS.settings = () => `
  <h1 class="page">Settings</h1>
  <p class="lede">Personalise the coach profile and course dates. Everything is saved in this browser; export a backup before switching devices.</p>
  <div class="panel">
    <div class="grid2">
      <div class="field"><label class="f" for="sn">Coach name</label><input class="in" id="sn" value="${esc(S.cfg.name)}" oninput="S.cfg.name=this.value;save();renderNav()"></div>
      <div class="field"><label class="f" for="ss">B course start date</label><input class="in" id="ss" type="date" value="${esc(S.cfg.start)}" onchange="S.cfg.start=this.value;save()"></div>
    </div>
    <div class="field"><label class="f" for="sb">Background line</label><input class="in" id="sb" value="${esc(S.cfg.bg)}" oninput="S.cfg.bg=this.value;save()"></div>
    <div class="grid2">
      <div class="field"><label class="f" for="st">A License track</label><select class="in" id="st" onchange="S.cfg.track=this.value;save();renderNav()"><option ${S.cfg.track==="Senior"?"selected":""}>Senior</option><option ${S.cfg.track==="Youth"?"selected":""}>Youth</option></select></div>
      <div class="field"><label class="f" for="sth">Appearance</label><select class="in" id="sth" onchange="S.cfg.theme=this.value;save();applyTheme()">${[["auto","Match device"],["light","Light"],["dark","Dark"]].map(([v,l])=>`<option value="${v}" ${S.cfg.theme===v?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
  </div>
  <h2 class="sec">Backup</h2>
  <div class="panel row">
    <button class="btn" onclick="exportData()">Export backup</button>
    <label class="btn ghost" style="cursor:pointer">Import backup<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label>
    <button class="btn ghost" onclick="if(confirm('Reset everything to the demo data? This clears all your changes.')){S=fresh();save();applyTheme();go('dash')}">Reset to demo data</button>
  </div>`;
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="coaching-license-lab-backup.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p||!p.model) throw 0; S=Object.assign(fresh(),p); save(); applyTheme(); toast("Backup imported"); go("dash"); }catch(e){ toast("That file isn't a Coaching License Lab backup"); } };
  r.readAsText(f);
}


/* ============================== LEARN: COURSE + DIAGRAMS ============================== */
const imgSrc = id => `images/${id}.png`;
function figure(id){
  const d = DIAGRAMS.find(x=>x.id===id); if(!d) return "";
  return `<button class="figthumb noprint" onclick="lbOpen(['${id}'],0)" aria-label="Open diagram: ${esc(d.title)}">
    <img src="${imgSrc(id)}" alt="" loading="lazy" onerror="this.style.display='none'">
    <span><b>${esc(d.title)}</b><span class="tiny">Diagram, module ${d.mod}. Tap to enlarge.</span></span></button>`;
}
VIEWS.course = () => {
  const m = MODULES.find(x=>x.n===UI.mod) || MODULES[0]; UI.mod = m.n;
  const vid = (CONFIG.videos||{})[m.n];
  const diags = DIAGRAMS.filter(d=>d.mod===m.n), ids = diags.map(d=>d.id);
  return `
  <h1 class="page">Course</h1>
  <p class="lede">Eight short modules. Watch the video, look through the diagrams, then go straight to the tool or drill that puts it into practice.</p>
  <div class="row" style="margin-bottom:18px">${MODULES.map(x=>`<button class="chip ${x.n===m.n?"on":""}" onclick="UI.mod=${x.n};render()">${x.n}. ${esc(x.title)}</button>`).join("")}</div>
  <div class="panel">
    <div class="row between"><h2 class="sec" style="margin:0">Module ${m.n}: ${esc(m.title)}</h2><span class="tiny">${m.n} of ${MODULES.length}</span></div>
    <div class="video" style="margin-top:14px">${vid
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(vid)}?rel=0" title="Module ${m.n} video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`
      : `<div class="video-empty"><b>Video in production</b><span class="small">The script for this module is in the repository. The video appears here once it’s approved.</span></div>`}</div>
    <h3 style="margin-top:18px">Key points</h3>
    <ul class="points">${m.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    ${diags.length?`<h3 style="margin-top:18px">Diagrams</h3><div class="thumbs">${diags.map((d,i)=>`<button class="thumb" onclick='lbOpen(${JSON.stringify(ids)},${i})'><img src="${imgSrc(d.id)}" alt="${esc(d.title)}" loading="lazy"><span>${esc(d.title)}</span></button>`).join("")}</div>`:""}
    <div class="row" style="margin-top:18px">
      ${m.tools.map(([v,l])=>`<button class="btn" onclick="go('${v}')">${l}</button>`).join("")}
      ${m.drill?`<button class="btn ghost" onclick="UI.qdom='${m.drill}';UI.quiz=null;go('drill')">Drill: ${QDOMAINS[m.drill].name}</button>`:""}
    </div>
  </div>
  <div class="row between" style="margin-top:14px">
    <button class="btn ghost sm" ${m.n===1?"disabled":""} onclick="UI.mod=${m.n-1};go('course')">Previous module</button>
    <button class="btn ghost sm" ${m.n===MODULES.length?"disabled":""} onclick="UI.mod=${m.n+1};go('course')">Next module</button>
  </div>`;
};
VIEWS.diagrams = () => {
  const ids = DIAGRAMS.map(d=>d.id);
  return `
  <h1 class="page">Diagrams</h1>
  <p class="lede">Every diagram in one place, all built on the ${esc(CONFIG.team)} scenario so the numbers match across the course. Each one ends with the common mistakes to watch for.</p>
  ${MODULES.map(m=>{const ds=DIAGRAMS.filter(d=>d.mod===m.n); if(!ds.length) return "";
    return `<h2 class="sec">${m.n}. ${esc(m.title)}</h2><div class="thumbs">${ds.map(d=>`<button class="thumb" onclick='lbOpen(${JSON.stringify(ids)},${ids.indexOf(d.id)})'><img src="${imgSrc(d.id)}" alt="${esc(d.title)}" loading="lazy"><span>${esc(d.title)}</span></button>`).join("")}</div>`;}).join("")}`;
};

/* lightbox: arrows, keys, swipe, counter, preloading */
const LB = {ids:[], i:0};
function lbOpen(ids,i){ LB.ids=ids; LB.i=i; let el=$("#lb");
  if(!el){ el=document.createElement("div"); el.id="lb"; el.className="lb"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
    el.innerHTML=`<button class="lb-x" onclick="lbClose()" aria-label="Close">Close</button><button class="lb-nav lb-prev" onclick="lbStep(-1)" aria-label="Previous diagram">‹</button><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure><button class="lb-nav lb-next" onclick="lbStep(1)" aria-label="Next diagram">›</button>`;
    el.addEventListener("click",e=>{ if(e.target===el) lbClose(); });
    let x0=null; el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
    el.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>45) lbStep(dx<0?1:-1); x0=null; });
    let wheelLock=false; el.addEventListener("wheel",e=>{ if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>25&&!wheelLock){ wheelLock=true; lbStep(e.deltaX>0?1:-1); setTimeout(()=>wheelLock=false,450);} },{passive:true});
    document.body.appendChild(el); }
  el.classList.add("open"); document.body.style.overflow="hidden"; lbShow(); el.querySelector(".lb-x").focus();
}
function lbShow(){ const id=LB.ids[LB.i], d=DIAGRAMS.find(x=>x.id===id);
  $("#lbimg").src=imgSrc(id); $("#lbimg").alt=d.title;
  $("#lbcap").innerHTML=`${esc(d.title)} (${LB.i+1} of ${LB.ids.length})<a href="${imgSrc(id)}" target="_blank" rel="noopener">Open full size</a>`;
  const multi=LB.ids.length>1; document.querySelectorAll(".lb-nav").forEach(b=>b.style.visibility=multi?"visible":"hidden");
  [LB.i-1,LB.i+1].forEach(j=>{ const k=(j+LB.ids.length)%LB.ids.length; const im=new Image(); im.src=imgSrc(LB.ids[k]); });
}
function lbStep(n){ if(LB.ids.length<2) return; LB.i=(LB.i+n+LB.ids.length)%LB.ids.length; lbShow(); }
function lbClose(){ const el=$("#lb"); if(el) el.classList.remove("open"); document.body.style.overflow=""; }
document.addEventListener("keydown",e=>{ const el=$("#lb"); if(!el||!el.classList.contains("open")) return;
  if(e.key==="Escape") lbClose(); else if(e.key==="ArrowRight") lbStep(1); else if(e.key==="ArrowLeft") lbStep(-1); });

/* ============================== INIT ============================== */
load(); applyTheme();
UI.view = (location.hash.slice(1) in VIEWS) ? location.hash.slice(1) : "dash";
window.addEventListener("hashchange",()=>{ const v=location.hash.slice(1); if(v in VIEWS && v!==UI.view) go(v); });
render();
</script>
